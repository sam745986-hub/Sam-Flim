<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>SAM NETWORK</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 padding:0;
 width:100%;
 height:100%;
 font-family:Arial,sans-serif;
 background:#f4f6f8;
}

button,input,select,textarea{
 font-family:inherit;
}

button{
 border:0;
 cursor:pointer;
}

#loginPage{
 width:100%;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#071d35,#087f8c);
 padding:20px;
}

.loginBox{
 width:100%;
 max-width:380px;
 background:white;
 border-radius:22px;
 padding:25px;
 box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.logo{
 text-align:center;
 font-size:30px;
 font-weight:bold;
 color:#087f8c;
 margin-bottom:5px;
}

.sub{
 text-align:center;
 color:#777;
 margin-bottom:22px;
}

.field{
 width:100%;
 padding:14px;
 border:1px solid #ddd;
 border-radius:12px;
 margin-bottom:12px;
 font-size:16px;
 outline:none;
}

.field:focus{
 border-color:#087f8c;
}

.btn{
 width:100%;
 padding:14px;
 border-radius:12px;
 font-size:16px;
 font-weight:bold;
 margin-top:6px;
}

.primary{
 background:#087f8c;
 color:white;
}

.dark{
 background:#09243d;
 color:white;
}

.light{
 background:#edf3f5;
 color:#123;
}

#app{
 display:none;
 width:100%;
 height:100vh;
 position:relative;
 overflow:hidden;
}

.topbar{
 position:absolute;
 top:0;
 left:0;
 right:0;
 height:60px;
 background:white;
 z-index:1000;
 display:flex;
 align-items:center;
 gap:8px;
 padding:8px 10px;
 box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.brand{
 font-size:19px;
 font-weight:bold;
 color:#087f8c;
 white-space:nowrap;
}

.search{
 flex:1;
 min-width:0;
 padding:10px;
 border:1px solid #ddd;
 border-radius:10px;
 outline:none;
}

.iconBtn{
 width:42px;
 height:42px;
 border-radius:11px;
 background:#edf3f5;
 font-size:20px;
 flex-shrink:0;
}

#map{
 position:absolute;
 top:60px;
 bottom:0;
 left:0;
 right:0;
 z-index:1;
}

.dashboard{
 position:absolute;
 left:10px;
 right:10px;
 top:70px;
 z-index:900;
 background:white;
 border-radius:16px;
 padding:10px;
 box-shadow:0 5px 18px rgba(0,0,0,.18);
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
}

.stat{
 background:#f1f6f7;
 border-radius:11px;
 padding:9px 5px;
 text-align:center;
}

.stat b{
 display:block;
 font-size:20px;
 color:#087f8c;
}

.stat span{
 font-size:11px;
 color:#555;
}

.actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-top:8px;
}

.action{
 padding:10px 4px;
 border-radius:10px;
 font-weight:bold;
 font-size:12px;
 background:#087f8c;
 color:white;
}

.action.orange{
 background:#e88b19;
}

.action.blue{
 background:#1769aa;
}

.action.red{
 background:#c62828;
}

.legend{
 position:absolute;
 bottom:12px;
 left:10px;
 z-index:800;
 background:white;
 border-radius:12px;
 padding:9px;
 box-shadow:0 3px 12px rgba(0,0,0,.2);
 font-size:11px;
}

.legend div{
 margin:4px 0;
}

.dot{
 display:inline-block;
 width:11px;
 height:11px;
 border-radius:50%;
 margin-right:5px;
}

.side{
 position:fixed;
 z-index:2000;
 top:0;
 right:-100%;
 width:100%;
 max-width:430px;
 height:100vh;
 background:white;
 transition:.25s;
 box-shadow:-5px 0 20px rgba(0,0,0,.25);
 overflow:auto;
 padding:20px;
}

.side.open{
 right:0;
}

.side h2{
 margin-top:0;
 color:#09243d;
}

.close{
 position:absolute;
 right:15px;
 top:12px;
 width:40px;
 height:40px;
 border-radius:10px;
 background:#eee;
 font-size:20px;
}

.locationBox{
 background:#eef7f8;
 padding:12px;
 border-radius:12px;
 margin:10px 0;
 font-size:13px;
}

.pick{
 background:#1769aa;
 color:white;
 padding:13px;
 width:100%;
 border-radius:11px;
 font-weight:bold;
}

.save{
 background:#087f8c;
 color:white;
 padding:14px;
 width:100%;
 border-radius:11px;
 font-size:16px;
 font-weight:bold;
 margin-top:10px;
}

.status{
 text-align:center;
 padding:8px;
 font-size:13px;
 color:#087f8c;
}

#pointsList{
 margin-top:10px;
}

.pointItem{
 padding:10px;
 border-bottom:1px solid #eee;
 display:flex;
 justify-content:space-between;
 gap:8px;
}

.pointName{
 font-weight:bold;
}

.pointType{
 font-size:11px;
 color:#777;
}

.deleteBtn{
 background:#ffe9e9;
 color:#c62828;
 border-radius:8px;
 padding:7px 9px;
}

#drawBar{
 display:none;
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 z-index:2500;
 background:white;
 padding:12px;
 box-shadow:0 -4px 18px rgba(0,0,0,.2);
}

.drawTitle{
 font-weight:bold;
 margin-bottom:8px;
}

.drawBtns{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
}

.drawBtns button{
 padding:11px 5px;
 border-radius:9px;
 background:#087f8c;
 color:white;
 font-weight:bold;
}

.drawBtns button.cancel{
 background:#c62828;
}

.pickMode{
 position:fixed;
 top:65px;
 left:50%;
 transform:translateX(-50%);
 z-index:3000;
 background:#09243d;
 color:white;
 padding:10px 15px;
 border-radius:20px;
 display:none;
 font-size:13px;
}

#toast{
 position:fixed;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 z-index:5000;
 background:#09243d;
 color:white;
 padding:12px 18px;
 border-radius:12px;
 display:none;
 max-width:90%;
 text-align:center;
}

@media(max-width:500px){
 .brand{
  font-size:16px;
 }
 .dashboard{
  top:68px;
 }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">

 <div class="loginBox">

  <div class="logo">SAM NETWORK</div>
  <div class="sub">Fiber Network Management</div>

  <input id="email"
   class="field"
   type="email"
   placeholder="Email">

  <input id="password"
   class="field"
   type="password"
   placeholder="Password">

  <button class="btn primary" onclick="login()">
   🔐 Login
  </button>

  <button class="btn light" onclick="signup()">
   ➕ নতুন Staff Account
  </button>

  <div id="loginStatus" class="status"></div>

 </div>

</div>


<!-- APP -->
<div id="app">

 <div class="topbar">

  <div class="brand">SAM NETWORK</div>

  <input
   id="search"
   class="search"
   placeholder="Search..."
   oninput="searchPoint()">

  <button class="iconBtn" onclick="locateMe()">📍</button>

  <button class="iconBtn" onclick="openPointPanel()">＋</button>

 </div>


 <div class="dashboard">

  <div class="stats">

   <div class="stat">
    <b id="totalPoints">0</b>
    <span>All Points</span>
   </div>

   <div class="stat">
    <b id="customers">0</b>
    <span>Customers</span>
   </div>

   <div class="stat">
    <b id="totalKm">0</b>
    <span>Fiber KM</span>
   </div>

  </div>


  <div class="actions">

   <button class="action"
    onclick="openPointPanel()">
    ＋ Point
   </button>

   <button class="action orange"
    onclick="beginLine()">
    📏 Fiber
   </button>

   <button class="action blue"
    onclick="locateMe()">
    📍 GPS
   </button>

   <button class="action"
    onclick="showPoints()">
    📋 Points
   </button>

   <button class="action red"
    onclick="logout()">
    🚪 Logout
   </button>

  </div>

 </div>


 <div id="map"></div>


 <div class="legend">

  <div>
   <span class="dot" style="background:#00a86b"></span>
   Fiber Drop
  </div>

  <div>
   <span class="dot" style="background:#1769aa"></span>
   Box
  </div>

  <div>
   <span class="dot" style="background:#8e44ad"></span>
   OLT
  </div>

  <div>
   <span class="dot" style="background:#f39c12"></span>
   Customer
  </div>

  <div>
   <span class="dot" style="background:#c62828"></span>
   Problem
  </div>

 </div>


 <div id="pointSide" class="side">

  <button class="close"
   onclick="closePointPanel()">×</button>

  <h2>নতুন Network Point</h2>

  <label>Point Type</label>

  <select id="pointType" class="field">
   <option value="fiber_drop">Fiber Drop</option>
   <option value="box">Fiber Box</option>
   <option value="olt">OLT</option>
   <option value="customer">Customer</option>
   <option value="problem">Problem</option>
  </select>


  <label>Name</label>

  <input
   id="pointName"
   class="field"
   placeholder="যেমন: Customer-01">


  <label>Address</label>

  <input
   id="pointAddress"
   class="field"
   placeholder="ঠিকানা">


  <label>Fiber Length (Meter)</label>

  <input
   id="fiberLength"
   class="field"
   type="number"
   placeholder="যেমন: 120">


  <label>Note</label>

  <textarea
   id="pointNote"
   class="field"
   rows="3"
   placeholder="কোনো তথ্য থাকলে লিখুন"></textarea>


  <div class="locationBox">

   <b>📍 Location</b>

   <div id="locationText">
    এখনো Location নেওয়া হয়নি
   </div>

  </div>


  <button class="pick"
   onclick="pickLocation()">
   🗺️ Map থেকে Location নিন
  </button>


  <button class="save"
   onclick="savePoint()">
   💾 Save Point
  </button>


  <div id="pointStatus" class="status"></div>

 </div>


 <div id="pointsSide" class="side">

  <button class="close"
   onclick="closePoints()">×</button>

  <h2>Network Points</h2>

  <div id="pointsList"></div>

 </div>


 <div id="drawBar">

  <div class="drawTitle">
   📏 Fiber Line Drawing
  </div>

  <div id="drawInfo">
   Map-এ ক্লিক করে Fiber route আঁকুন
  </div>

  <div class="drawBtns">

   <button onclick="undoLine()">
    ↩ Undo
   </button>

   <button onclick="saveLine()">
    💾 Save
   </button>

   <button class="cancel"
    onclick="cancelLine()">
    ✖ Cancel
   </button>

  </div>

 </div>


 <div id="pickMode">
  📍 Map-এ যেখানে Point হবে সেখানে চাপুন
 </div>

</div>


<div id="toast"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cuzgpesjgjxogmbzbxhf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tTHhdAGnSwTOuWlsnH9c4w_C1Lghz71";


let accessToken = localStorage.getItem("sam_access_token") || "";
let user = null;


/* =========================
   MAP
========================= */

let map;

let markers = [];
let fiberLayers = [];

let points = [];
let lines = [];

let currentLocation = null;

let pickingLocation = false;

let drawingLine = false;

let currentLine = [];

let temporaryLine = null;


/* =========================
   START
========================= */

window.onload = function(){

 initMap();

 if(accessToken){

  getCurrentUser()
   .then(ok=>{

    if(ok){
     showApp();
     loadData();
    }else{
     showLogin();
    }

   });

 }else{

  showLogin();

 }

};


/* =========================
   MAP INIT
========================= */

function initMap(){

 map = L.map("map").setView(
  [23.8103,90.4125],
  13
 );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:20,
   attribution:"© OpenStreetMap"
  }
 ).addTo(map);


 map.on("click",function(e){

  /* POINT LOCATION */

  if(pickingLocation){

   currentLocation = {
    lat:e.latlng.lat,
    lng:e.latlng.lng
   };

   pickingLocation = false;

   document.getElementById("pickMode").style.display="none";

   document.getElementById("locationText").innerHTML =
    "Latitude: "+e.latlng.lat.toFixed(6)+
    "<br>Longitude: "+e.latlng.lng.toFixed(6);

   document.getElementById("pointSide").classList.add("open");

   showToast("Location নেওয়া হয়েছে");

   return;
  }


  /* FIBER LINE */

  if(drawingLine){

   currentLine.push([
    e.latlng.lat,
    e.latlng.lng
   ]);

   drawTemporaryLine();

  }

 });

}


/* =========================
   AUTH
========================= */

async function login(){

 const email =
  document.getElementById("email").value.trim();

 const password =
  document.getElementById("password").value;

 if(!email || !password){

  setLoginStatus("Email ও Password দিন");

  return;
 }


 setLoginStatus("Login হচ্ছে...");


 try{

  const res = await fetch(
   SUPABASE_URL+"/auth/v1/token?grant_type=password",
   {
    method:"POST",

    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY
    },

    body:JSON.stringify({
     email:email,
     password:password
    })
   }
  );


  const data = await res.json();


  if(!res.ok){

   throw new Error(
    data.error_description ||
    data.msg ||
    "Login failed"
   );

  }


  accessToken = data.access_token;

  user = data.user;

  localStorage.setItem(
   "sam_access_token",
   accessToken
  );


  showApp();

  await loadData();

  showToast("Login সফল হয়েছে");

 }catch(err){

  setLoginStatus(
   "❌ "+err.message
  );

 }

}


async function signup(){

 const email =
  document.getElementById("email").value.trim();

 const password =
  document.getElementById("password").value;


 if(!email || !password){

  setLoginStatus(
   "Email ও Password দিন"
  );

  return;

 }


 if(password.length < 6){

  setLoginStatus(
   "Password কমপক্ষে 6 অক্ষরের হতে হবে"
  );

  return;

 }


 setLoginStatus("Account তৈরি হচ্ছে...");


 try{

  const res = await fetch(
   SUPABASE_URL+"/auth/v1/signup",
   {
    method:"POST",

    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY
    },

    body:JSON.stringify({
     email:email,
     password:password
    })
   }
  );


  const data = await res.json();


  if(!res.ok){

   throw new Error(
    data.msg ||
    data.error_description ||
    "Signup failed"
   );

  }


  if(data.access_token){

   accessToken=data.access_token;

   user=data.user;

   localStorage.setItem(
    "sam_access_token",
    accessToken
   );

   showApp();

   await loadData();

  }else{

   setLoginStatus(
    "Account তৈরি হয়েছে। Email verify করে Login করুন।"
   );

  }


 }catch(err){

  setLoginStatus(
   "❌ "+err.message
  );

 }

}


async function getCurrentUser(){

 try{

  const res = await fetch(
   SUPABASE_URL+"/auth/v1/user",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+accessToken
    }
   }
  );


  if(!res.ok){

   localStorage.removeItem(
    "sam_access_token"
   );

   accessToken="";

   return false;

  }


  user=await res.json();

  return true;

 }catch(e){

  return false;

 }

}


function logout(){

 localStorage.removeItem(
  "sam_access_token"
 );

 accessToken="";
 user=null;

 document.getElementById("app").style.display="none";
 document.getElementById("loginPage").style.display="flex";

}


/* =========================
   UI
========================= */

function showApp(){

 document.getElementById("loginPage").style.display="none";

 document.getElementById("app").style.display="block";

 setTimeout(()=>{
  map.invalidateSize();
 },300);

}


function showLogin(){

 document.getElementById("app").style.display="none";

 document.getElementById("loginPage").style.display="flex";

}


function setLoginStatus(text){

 document.getElementById(
  "loginStatus"
 ).innerText=text;

}


function showToast(text){

 const el=document.getElementById("toast");

 el.innerText=text;

 el.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  el.style.display="none";
 },2500);

}


/* =========================
   POINT PANEL
========================= */

function openPointPanel(){

 document.getElementById(
  "pointsSide"
 ).classList.remove("open");

 document.getElementById(
  "pointSide"
 ).classList.add("open");

}


function closePointPanel(){

 document.getElementById(
  "pointSide"
 ).classList.remove("open");

}


function pickLocation(){

 document.getElementById(
  "pointSide"
 ).classList.remove("open");

 pickingLocation=true;

 document.getElementById(
  "pickMode"
 ).style.display="block";

 showToast(
  "এখন Map-এ Location-এ চাপ দিন"
 );

}


function resetPointForm(){

 document.getElementById("pointName").value="";
 document.getElementById("pointAddress").value="";
 document.getElementById("fiberLength").value="";
 document.getElementById("pointNote").value="";

 currentLocation=null;

 document.getElementById(
  "locationText"
 ).innerHTML=
 "এখনো Location নেওয়া হয়নি";

}


/* =========================
   SAVE POINT
========================= */

async function savePoint(){

 if(!user){

  showToast("আগে Login করুন");

  return;

 }


 if(!currentLocation){

  showToast(
   "আগে Map থেকে Location নিন"
  );

  return;

 }


 const type =
  document.getElementById(
   "pointType"
  ).value;


 const name =
  document.getElementById(
   "pointName"
  ).value.trim();


 const address =
  document.getElementById(
   "pointAddress"
  ).value.trim();


 const fiberLength =
  parseFloat(
   document.getElementById(
    "fiberLength"
   ).value
  ) || 0;


 const note =
  document.getElementById(
   "pointNote"
  ).value.trim();


 if(!name){

  showToast("Point-এর নাম দিন");

  return;

 }


 document.getElementById(
  "pointStatus"
 ).innerText="Saving...";


 try{

  const res=await fetch(
   SUPABASE_URL+"/rest/v1/network_points",
   {
    method:"POST",

    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+accessToken,
     "Content-Type":"application/json",
     "Prefer":"return=representation"
    },

    body:JSON.stringify({

     name:name,

     point_type:type,

     latitude:currentLocation.lat,

     longitude:currentLocation.lng,

     fiber_length:fiberLength,

     address:address,

     note:note,

     created_by:user.id

    })
   }
  );


  const data=await res.json();


  if(!res.ok){

   throw new Error(
    data.message ||
    data.error_description ||
    JSON.stringify(data)
   );

  }


  document.getElementById(
   "pointStatus"
  ).innerText="";

  resetPointForm();

  closePointPanel();

  showToast(
   "✅ Point সফলভাবে Save হয়েছে"
  );

  await loadData();

 }catch(err){

  document.getElementById(
   "pointStatus"
  ).innerText=
   "❌ "+err.message;

 }

}


/* =========================
   LOAD DATA
========================= */

async function loadData(){

 try{

  const pRes=await fetch(
   SUPABASE_URL+
   "/rest/v1/network_points?select=*&order=created_at.desc",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+accessToken
    }
   }
  );


  if(!pRes.ok){

   const error=await pRes.text();

   throw new Error(error);

  }


  points=await pRes.json();


  const lRes=await fetch(
   SUPABASE_URL+
   "/rest/v1/fiber_lines?select=*&order=created_at.desc",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+accessToken
    }
   }
  );


  if(lRes.ok){

   lines=await lRes.json();

  }else{

   lines=[];

  }


  drawEverything();

 }catch(err){

  console.log(err);

  showToast(
   "Cloud data load হয়নি"
  );

 }

}


/* =========================
   DRAW EVERYTHING
========================= */

function drawEverything(){

 markers.forEach(m=>{
  map.removeLayer(m);
 });

 markers=[];


 fiberLayers.forEach(l=>{
  map.removeLayer(l);
 });

 fiberLayers=[];


 points.forEach(p=>{

  if(
   p.latitude==null ||
   p.longitude==null
  ) return;


  const color=getPointColor(
   p.point_type
  );


  const marker=L.circleMarker(
   [p.latitude,p.longitude],
   {
    radius:9,
    color:"#fff",
    weight:2,
    fillColor:color,
    fillOpacity:1
   }
  ).addTo(map);


  marker.bindPopup(
   "<b>"+escapeHtml(p.name||"Point")+"</b>"+
   "<br>Type: "+escapeHtml(p.point_type||"")+
   "<br>Fiber: "+(p.fiber_length||0)+" m"+
   (p.address?
    "<br>"+escapeHtml(p.address):
    "")+
   (p.note?
    "<br>"+escapeHtml(p.note):
    "")
  );


  markers.push(marker);

 });


 lines.forEach(line=>{

  let path=line.path;

  if(typeof path==="string"){

   try{
    path=JSON.parse(path);
   }catch(e){
    return;
   }

  }


  if(!Array.isArray(path)) return;


  const latlngs=path.map(x=>[
   Number(x[0]),
   Number(x[1])
  ]);


  const poly=L.polyline(
   latlngs,
   {
    color:"#087f8c",
    weight:5
   }
  ).addTo(map);


  poly.bindPopup(
   "<b>Fiber Line</b>"+
   "<br>Length: "+
   ((line.length_m||0)/1000).toFixed(3)+
   " KM"
  );


  fiberLayers.push(poly);

 });


 updateDashboard();

 renderList();

}


function getPointColor(type){

 if(type==="fiber_drop") return "#00a86b";

 if(type==="box") return "#1769aa";

 if(type==="olt") return "#8e44ad";

 if(type==="customer") return "#f39c12";

 if(type==="problem") return "#c62828";

 return "#555";

}


function escapeHtml(text){

 return String(text)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================
   DASHBOARD
========================= */

function updateDashboard(){

 document.getElementById(
  "totalPoints"
 ).innerText=points.length;


 document.getElementById(
  "customers"
 ).innerText=
  points.filter(
   p=>p.point_type==="customer"
  ).length;


 let km=0;

 lines.forEach(l=>{
  km+=Number(l.length_m||0);
 });


 points.forEach(p=>{
  km+=Number(p.fiber_length||0);
 });


 document.getElementById(
  "totalKm"
 ).innerText=
  (km/1000).toFixed(2);

}


/* =========================
   POINT LIST
========================= */

function showPoints(){

 document.getElementById(
  "pointsSide"
 ).classList.add("open");

 renderList();

}


function closePoints(){

 document.getElementById(
  "pointsSide"
 ).classList.remove("open");

}


function renderList(){

 const list=
  document.getElementById(
   "pointsList"
  );


 if(!points.length){

  list.innerHTML=
   "<p>কোনো Point নেই।</p>";

  return;

 }


 list.innerHTML="";


 points.forEach(p=>{

  const div=
   document.createElement("div");

  div.className="pointItem";


  div.innerHTML=

   "<div>"+
    "<div class='pointName'>"+
     escapeHtml(p.name||"Point")+
    "</div>"+
    "<div class='pointType'>"+
     escapeHtml(p.point_type||"")+
    "</div>"+
   "</div>"+

   "<button class='deleteBtn' "+
    "onclick=\"deletePoint('"+
    p.id+
    "')\">"+
    "Delete"+
   "</button>";


  div.onclick=function(e){

   if(
    e.target.classList.contains(
     "deleteBtn"
    )
   ) return;


   if(
    p.latitude!=null &&
    p.longitude!=null
   ){

    map.setView(
     [p.latitude,p.longitude],
     18
    );

    closePoints();

   }

  };


  list.appendChild(div);

 });

}


/* =========================
   DELETE POINT
========================= */

async function deletePoint(id){

 if(!confirm(
  "এই Point Delete করতে চান?"
 )) return;


 try{

  const res=await fetch(
   SUPABASE_URL+
   "/rest/v1/network_points?id=eq."+encodeURIComponent(id),
   {
    method:"DELETE",

    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+accessToken
    }
   }
  );


  if(!res.ok){

   throw new Error(
    await res.text()
   );

  }


  showToast(
   "Point Delete হয়েছে"
  );

  await loadData();

 }catch(err){

  showToast(
   "Delete হয়নি"
  );

 }

}


/* =========================
   SEARCH
========================= */

function searchPoint(){

 const q=
  document.getElementById(
   "search"
  ).value.trim().toLowerCase();


 if(!q) return;


 const found=points.find(p=>
  String(p.name||"")
   .toLowerCase()
   .includes(q) ||

  String(p.address||"")
   .toLowerCase()
   .includes(q)
 );


 if(found){

  map.setView(
   [found.latitude,found.longitude],
   18
  );

  const marker=
   markers.find(m=>{
    const pos=m.getLatLng();

    return(
     Math.abs(
      pos.lat-found.latitude
     )<0.000001 &&
     Math.abs(
      pos.lng-found.longitude
     )<0.000001
    );
   });


  if(marker) marker.openPopup();

 }

}


/* =========================
   GPS
========================= */

function locateMe(){

 if(!navigator.geolocation){

  showToast(
   "এই Browser GPS support করে না"
  );

  return;

 }


 showToast(
  "GPS Location নেওয়া হচ্ছে..."
 );


 navigator.geolocation.getCurrentPosition(

  function(pos){

   const lat=pos.coords.latitude;

   const lng=pos.coords.longitude;


   map.setView(
    [lat,lng],
    18
   );


   L.marker(
    [lat,lng]
   )
   .addTo(map)
   .bindPopup(
    "📍 আপনার বর্তমান Location"
   )
   .openPopup();


   showToast(
    "GPS Location পাওয়া গেছে"
   );

  },

  function(err){

   showToast(
    "GPS Permission দিন"
   );

  },

  {
   enableHighAccuracy:true,
   timeout:15000
  }

 );

}


/* =========================
   FIBER LINE
========================= */

function beginLine(){

 drawingLine=true;

 currentLine=[];

 document.getElementById(
  "drawBar"
 ).style.display="block";

 document.getElementById(
  "drawInfo"
 ).innerText=
  "Map-এ ক্লিক করে Fiber route আঁকুন";

 showToast(
  "Fiber route আঁকা শুরু করুন"
 );

}


function drawTemporaryLine(){

 if(temporaryLine){

  map.removeLayer(
   temporaryLine
  );

 }


 if(currentLine.length<2){

  document.getElementById(
   "drawInfo"
  ).innerText=
   "আরও একটি Point দিন";

  return;

 }


 temporaryLine=
  L.polyline(
   currentLine,
   {
    color:"#e88b19",
    weight:5,
    dashArray:"8,8"
   }
  ).addTo(map);


 const meters=
  calculateLineLength(
   currentLine
  );


 document.getElementById(
  "drawInfo"
 ).innerText=
  "Points: "+
  currentLine.length+
  " | Length: "+
  meters.toFixed(1)+
  " meter";

}


function calculateLineLength(path){

 let total=0;

 for(
  let i=1;
  i<path.length;
  i++
 ){

  total+=map.distance(
   L.latLng(
    path[i-1][0],
    path[i-1][1]
   ),
   L.latLng(
    path[i][0],
    path[i][1]
   )
  );

 }

 return total;

}


function undoLine(){

 if(currentLine.length){

  currentLine.pop();

  drawTemporaryLine();

 }

}


function cancelLine(){

 drawingLine=false;

 currentLine=[];

 if(temporaryLine){

  map.removeLayer(
   temporaryLine
  );

  temporaryLine=null;

 }

 document.getElementById(
  "drawBar"
 ).style.display="none";

}


async function saveLine(){

 if(currentLine.length<2){

  showToast(
   "কমপক্ষে ২টি Map Point দিন"
  );

  return;

 }


 const length=
  calculateLineLength(
   currentLine
  );


 const name=
  prompt(
   "Fiber Line-এর নাম দিন",
   "Fiber Line"
  );


 if(!name) return;


 try{

  const res=await fetch(
   SUPABASE_URL+
   "/rest/v1/fiber_lines",
   {
    method:"POST",

    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+accessToken,
     "Content-Type":"application/json",
     "Prefer":"return=representation"
    },

    body:JSON.stringify({

     name:name,

     path:currentLine,

     length_m:length,

     created_by:user.id

    })
   }
  );


  const data=await res.json();


  if(!res.ok){

   throw new Error(
    JSON.stringify(data)
   );

  }


  showToast(
   "✅ Fiber Line Save হয়েছে"
  );


  cancelLine();

  await loadData();

 }catch(err){

  showToast(
   "❌ Fiber Line Save হয়নি"
  );

  console.log(err);

 }

}

</script>
