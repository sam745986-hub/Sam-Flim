<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SAM Network Manager</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#071019;
color:#fff
}

button,input,select,textarea{
font:inherit
}

button{
border:0;
border-radius:9px;
padding:10px 13px;
background:#1b2733;
color:white;
font-weight:bold;
cursor:pointer
}

button.green{
background:#16a34a
}

button.red{
background:#dc2626
}

header{
height:62px;
background:#0d1720;
border-bottom:1px solid #263544;
display:flex;
align-items:center;
padding:0 12px;
gap:10px;
position:relative;
z-index:1500
}

.logo{
font-size:18px;
font-weight:900;
white-space:nowrap
}

.logo span{
color:#22c55e
}

.search{
flex:1;
max-width:450px
}

.search input{
width:100%;
background:#101c27;
border:1px solid #2a3a49;
color:white;
padding:10px 14px;
border-radius:22px;
outline:none
}

#map{
height:calc(100vh - 62px);
width:100%
}

.dashboard{
position:absolute;
z-index:1200;
top:75px;
left:10px;
width:320px;
max-width:calc(100% - 20px);
background:#0d1720f2;
border:1px solid #2b3b4a;
border-radius:14px;
padding:12px;
box-shadow:0 10px 30px #0008
}

.dashboard h3{
margin:0 0 10px
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:6px
}

.stat{
background:#15222d;
border:1px solid #2a3947;
border-radius:9px;
padding:8px;
text-align:center
}

.stat b{
display:block;
font-size:18px
}

.stat small{
color:#9ca9b6
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
margin-top:10px
}

.status{
font-size:12px;
color:#aab6c2;
margin-top:9px;
line-height:1.5
}

.legend{
position:absolute;
z-index:1200;
right:10px;
bottom:15px;
background:#0d1720ed;
border:1px solid #2b3b4a;
padding:9px;
border-radius:10px;
font-size:11px;
line-height:1.8
}

.dot{
display:inline-block;
width:10px;
height:10px;
border-radius:50%;
margin-right:5px
}

.modal{
display:none;
position:fixed;
inset:0;
z-index:3000;
background:#000b;
align-items:flex-end;
justify-content:center
}

.modal.show{
display:flex
}

.form{
width:min(550px,100%);
max-height:92vh;
overflow:auto;
background:#0d1720;
border:1px solid #2c3c4b;
border-radius:18px 18px 0 0;
padding:16px
}

.form h2{
margin:0 0 10px
}

.form label{
display:block;
font-size:12px;
color:#9ca9b6;
margin:9px 0 4px
}

.form input,
.form select,
.form textarea{
width:100%;
padding:10px;
background:#081119;
border:1px solid #2b3b4a;
border-radius:8px;
color:white;
outline:none
}

.form textarea{
min-height:80px
}

.actions{
display:flex;
gap:7px;
margin-top:13px
}

.actions button{
flex:1
}

.close{
background:#263442
}

.popup-title{
font-weight:bold;
font-size:15px
}

.popup-body{
font-size:12px;
line-height:1.7
}

.popup-body b{
color:#222
}

.login{
position:fixed;
inset:0;
z-index:5000;
background:#071019;
display:flex;
align-items:center;
justify-content:center;
padding:15px
}

.login.hidden{
display:none
}

.login-box{
width:min(390px,100%);
background:#101c26;
border:1px solid #2b3b4a;
border-radius:17px;
padding:20px
}

.login-box h1{
margin-top:0
}

.login-box input{
width:100%;
margin:5px 0;
padding:12px;
background:#081119;
border:1px solid #2b3b4a;
border-radius:9px;
color:white
}

.login-box button{
width:100%;
margin-top:8px
}

.login-msg{
font-size:12px;
color:#f59e0b;
margin-top:8px
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip{
background:#fff;
color:#111
}

@media(max-width:600px){

header{
height:58px
}

.logo{
font-size:15px
}

#map{
height:calc(100vh - 58px)
}

.dashboard{
top:68px
}

}
</style>
</head>

<body>

<h2>📍 Network Point</h2>

<select id="pointType">

🟣 Customer

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<script>

const SUPABASE_URL =
"https://cuzgpesjgjxogmbzbxhf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tTHhdAGnSwTOuWlsnH9c4w_C1Lghz71";


let token =
localStorage.getItem("sam_access_token");

let user =
JSON.parse(
localStorage.getItem("sam_user") || "null"
);

let map;

let points=[];

let lines=[];

let markers=[];

let myLocation;

let drawing=false;

let drawPoints=[];

let drawLayer;


const COLORS={

customer:"#a855f7",

fiber_drop:"#22c55e",

box:"#f59e0b",

olt:"#2563eb",

problem:"#ef4444"

};


const NAMES={

customer:"Customer",

fiber_drop:"Fiber Drop",

box:"Box / Splitter",

olt:"OLT",

problem:"Problem"

};


function headers(extra={}){

return Object.assign({

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+(token || SUPABASE_KEY),

"Content-Type":
"application/json"

},extra);

}


async function api(path,options={}){

options.headers=
headers(options.headers||{});

return fetch(
SUPABASE_URL+"/rest/v1/"+path,
options
);

}


/* LOGIN */

async function login(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

if(!email || !password){

document.getElementById("loginMsg")
.textContent=
"Email এবং Password দিন";

return;

}

document.getElementById("loginMsg")
.textContent="Login হচ্ছে...";


try{

const r=await fetch(
SUPABASE_URL+
"/auth/v1/token?grant_type=password",
{

method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

}
);

const data=await r.json();

if(!r.ok){

throw new Error(
data.error_description ||
data.msg ||
"Login failed"
);

}

token=data.access_token;

user=data.user;

localStorage.setItem(
"sam_access_token",
token
);

localStorage.setItem(
"sam_user",
JSON.stringify(user)
);

showApp();

}catch(e){

document.getElementById("loginMsg")
.textContent=e.message;

}

}


async function signup(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

if(!email || !password){

document.getElementById("loginMsg")
.textContent=
"Email এবং Password দিন";

return;

}

if(password.length<6){

document.getElementById("loginMsg")
.textContent=
"Password কমপক্ষে ৬ অক্ষরের হতে হবে";

return;

}

document.getElementById("loginMsg")
.textContent=
"Account তৈরি হচ্ছে...";


try{

const r=await fetch(
SUPABASE_URL+"/auth/v1/signup",
{

method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
password
})

}
);

const data=await r.json();

if(!r.ok){

throw new Error(
data.msg ||
data.error_description ||
"Signup failed"
);

}

if(data.access_token){

token=data.access_token;

user=data.user;

localStorage.setItem(
"sam_access_token",
token
);

localStorage.setItem(
"sam_user",
JSON.stringify(user)
);

showApp();

}else{

document.getElementById("loginMsg")
.textContent=
"Account তৈরি হয়েছে। Email verification চাইলে Email verify করে Login করুন।";

}

}catch(e){

document.getElementById("loginMsg")
.textContent=e.message;

}

}


async function logout(){

try{

if(token){

await fetch(
SUPABASE_URL+"/auth/v1/logout",
{
method:"POST",
headers:headers()
}
);

}

}catch(e){}

localStorage.removeItem(
"sam_access_token"
);

localStorage.removeItem(
"sam_user"
);

location.reload();

}


function showApp(){

document.getElementById(
"loginScreen"
).classList.add("hidden");

setTimeout(
loadData,
300
);

}


function checkLogin(){

if(token){

showApp();

}

}


/* MAP */

function initMap(){

map=L.map("map")
.setView(
[23.8103,90.4125],
13
);

L.tileLayer(
"https://tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:
"© OpenStreetMap"
}
).addTo(map);


map.on(
"click",
function(e){

if(drawing){

addDrawPoint(
e.latlng
);

}

});

}


function icon(type){

const color=
COLORS[type] || "#111827";

return L.divIcon({

className:"",

html:

`<div style="
width:20px;
height:20px;
background:${color};
border:3px solid white;
border-radius:50%;
box-shadow:0 2px 8px #000;
"></div>`,

iconSize:[20,20],

iconAnchor:[10,10]

});

}


function escapeHTML(text){

return String(text||"")
.replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}


function addMarker(p){

const marker=
L.marker(
[
p.latitude,
p.longitude
],
{
icon:icon(p.point_type)
}
)
.addTo(map);

marker.pointId=p.id;

marker.bindPopup(`

<div class="popup-title">

${NAMES[p.point_type] || p.point_type}

</div>

<div class="popup-body">

<b>${escapeHTML(p.name||"Unnamed")}</b>

<br>

📞 ${escapeHTML(p.phone||"")}

<br>

📍 ${escapeHTML(p.address||"")}

<br>

🧵 Fiber:
${Number(p.fiber_length||0)} m

<br>

🔌 Type:
${escapeHTML(p.fiber_type||"")}

<br>

📊 Status:
${escapeHTML(p.status||"")}

<br>

📝 ${escapeHTML(p.note||"")}

<br><br>

<button
onclick="deletePoint('${p.id}')"
style="background:#dc2626;color:white">
Delete
</button>

</div>

`);

markers.push(marker);

}


async function loadData(){

document.getElementById("status")
.textContent=
"☁️ Cloud data loading...";


try{

const pr=
await api(
"network_points?select=*&order=created_at.desc"
);

if(pr.status===401){

logout();

return;

}

if(!pr.ok){

throw new Error(
await pr.text()
);

}

points=await pr.json();


markers.forEach(
m=>map.removeLayer(m)
);

markers=[];

points.forEach(addMarker);


const lr=
await api(
"fiber_lines?select=*&order=created_at.desc"
);

if(lr.ok){

lines=await lr.json();

lines.forEach(
drawSavedLine
);

}


updateDashboard();


document.getElementById("status")
.textContent=
"☁️ Cloud connected • "+
points.length+
" points loaded";

}catch(e){

document.getElementById("status")
.textContent=
"❌ Cloud error: "+
e.message;

}

}


function updateDashboard(){

document.getElementById(
"points"
).textContent=
points.length;


document.getElementById(
"customers"
).textContent=
points.filter(
p=>p.point_type==="customer"
).length;


let total=0;

lines.forEach(
l=>{
total+=Number(
l.length_m||0
);
}
);

document.getElementById(
"km"
).textContent=
(total/1000).toFixed(2);

}


/* POINT FORM */

let selectedLocation=null;


function openPointForm(){

selectedLocation=null;

document.getElementById(
"pointModal"
).classList.add("show");

document.getElementById(
"pointMsg"
).textContent=
"ম্যাপে যেখানে Point বসাতে চান সেখানে ক্লিক করুন।";

map.once(
"click",
function(e){

selectedLocation=e.latlng;

document.getElementById(
"pointMsg"
).textContent=
"📍 Location selected: "+
e.latlng.lat.toFixed(6)+
", "+
e.latlng.lng.toFixed(6);

});

}


function closePointForm(){

document.getElementById(
"pointModal"
).classList.remove("show");

}


async function savePoint(){

if(!selectedLocation){

document.getElementById(
"pointMsg"
).textContent=
"⚠️ আগে ম্যাপে একটি জায়গায় ক্লিক করুন।";

return;

}


const body={

name:
document.getElementById(
"pointName"
).value.trim(),

point_type:
document.getElementById(
"pointType"
).value,

latitude:
selectedLocation.lat,

longitude:
selectedLocation.lng,

phone:
document.getElementById(
"pointPhone"
).value.trim(),

address:
document.getElementById(
"pointAddress"
).value.trim(),

fiber_length:
Number(
document.getElementById(
"pointFiber"
).value || 0
),

fiber_type:
document.getElementById(
"fiberType"
).value,

status:
document.getElementById(
"pointStatus"
).value,

note:
document.getElementById(
"pointNote"
).value.trim()

};


document.getElementById(
"pointMsg"
).textContent=
"☁️ Saving...";


try{

const r=
await api(
"network_points",
{

method:"POST",

headers:{
"Prefer":
"return=representation"
},

body:
JSON.stringify(body)

}
);


if(!r.ok){

throw new Error(
await r.text()
);

}


const saved=
(await r.json())[0];

points.unshift(saved);

addMarker(saved);

updateDashboard();

closePointForm();


document.getElementById(
"pointName"
).value="";

document.getElementById(
"pointPhone"
).value="";

document.getElementById(
"pointAddress"
).value="";

document.getElementById(
"pointFiber"
).value="";

document.getElementById(
"pointNote"
).value="";


}catch(e){

document.getElementById(
"pointMsg"
).textContent=
"❌ Save failed: "+
e.message;

}

}


/* DELETE POINT */

async function deletePoint(id){

if(
!confirm(
"এই Point মুছে ফেলবেন?"
)
)return;


try{

const r=
await api(
"network_points?id=eq."+encodeURIComponent(id),
{
method:"DELETE"
}
);


if(!r.ok){

throw new Error(
await r.text()
);

}


const marker=
markers.find(
m=>m.pointId===id
);

if(marker){

map.removeLayer(marker);

markers=
markers.filter(
m=>m!==marker
);

}


points=
points.filter(
p=>p.id!==id
);

updateDashboard();

}catch(e){

alert(
"Delete failed: "+
e.message
);

}

}


/* GPS */

function locateMe(){

navigator.geolocation.getCurrentPosition(

function(pos){

const lat=
pos.coords.latitude;

const lng=
pos.coords.longitude;


map.setView(
[lat,lng],
17
);


if(myLocation){

myLocation.setLatLng(
[lat,lng]
);

}else{

myLocation=
L.circleMarker(
[lat,lng],
{
radius:9,
color:"#fff",
weight:3,
fillColor:"#06b6d4",
fillOpacity:1
}
)
.addTo(map)
.bindPopup(
"📍 আপনার বর্তমান অবস্থান"
)
.openPopup();

}

},

function(){

alert(
"⚠️ Location permission দিন এবং GPS চালু রাখুন।"
);

},

{
enableHighAccuracy:true,
timeout:10000,
maximumAge:0
}

);

}


/* SEARCH */

function searchMap(){

const q=
document.getElementById(
"search"
).value
.toLowerCase()
.trim();

if(!q)return;


const p=
points.find(
x=>

String(x.name||"")
.toLowerCase()
.includes(q)

||

String(x.phone||"")
.toLowerCase()
.includes(q)

||

String(x.address||"")
.toLowerCase()
.includes(q)

||

String(x.note||"")
.toLowerCase()
.includes(q)

);


if(p){

map.setView(
[
p.latitude,
p.longitude
],
18
);


const marker=
markers.find(
m=>m.pointId===p.id
);

if(marker){

marker.openPopup();

}

}

}


/* FIBER LINE */

function startLine(){

if(drawing){

drawing=false;

drawPoints=[];

if(drawLayer){

map.removeLayer(
drawLayer
);

drawLayer=null;

}

document.getElementById(
"status"
).textContent=
"Fiber drawing cancelled.";

return;

}


drawing=true;

drawPoints=[];


document.getElementById(
"status"
).textContent=
"🧵 Fiber Line Mode: ম্যাপে একের পর এক ক্লিক করুন।";

}


function addDrawPoint(ll){

drawPoints.push(
[
ll.lat,
ll.lng
]
);


if(drawLayer){

map.removeLayer(
drawLayer
);

}


drawLayer=
L.polyline(
drawPoints,
{
color:"#22c55e",
weight:6,
opacity:.9
}
).addTo(map);


if(drawPoints.length>=2){

const meters=
calculateLength();

document.getElementById(
"status"
).textContent=
"🧵 Fiber: "+
Math.round(meters)+
" meter";


if(
confirm(
"এই Fiber Line Save করবেন?\n\n"+
"Length: "+
Math.round(meters)+
" meter"
)
){

saveLine();

}

}

}


function calculateLength(){

let total=0;

for(
let i=1;
i<drawPoints.length;
i++
){

total+=map.distance(
drawPoints[i-1],
drawPoints[i]
);

}

return total;

}


async function saveLine(){

if(drawPoints.length<2){

return;

}


const meters=
calculateLength();


try{

const r=
await api(
"fiber_lines",
{

method:"POST",

headers:{
"Prefer":
"return=representation"
},

body:
JSON.stringify({

name:
"Fiber Line",

path:
drawPoints,

length_m:
Math.round(meters)

})

}
);


if(!r.ok){

throw new Error(
await r.text()
);

}


const saved=
(await r.json())[0];

lines.unshift(saved);

drawSavedLine(saved);

drawing=false;

drawPoints=[];


if(drawLayer){

map.removeLayer(
drawLayer
);

drawLayer=null;

}


updateDashboard();


document.getElementById(
"status"
).textContent=
"✅ Fiber Line Saved: "+
Math.round(meters)+
" meter";


}catch(e){

alert(
"❌ Line Save Failed:\n"+
e.message
);

}

}


function drawSavedLine(line){

if(
!line.path ||
line.path.length<2
)return;


const layer=
L.polyline(
line.path,
{
color:"#22c55e",
weight:5,
opacity:.85
}
).addTo(map);


layer.bindPopup(
"🧵 Fiber Line<br>"+
"📏 "+
Number(
line.length_m||0
)+
" meter"
);

}


/* START */

initMap();

checkLogin();

</script>

</body>
</html>
