<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SAM NETWORK</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 font-family:Arial,sans-serif;
 overflow:hidden;
}

button,input,select,textarea{
 font-family:inherit;
}

button{cursor:pointer}

#loginPage{
 width:100%;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,#06243d,#07858d);
 padding:20px;
}

.loginBox{
 width:100%;
 max-width:380px;
 background:#fff;
 border-radius:20px;
 padding:25px;
 box-shadow:0 10px 40px #0005;
}

.logo{
 text-align:center;
 font-size:28px;
 font-weight:bold;
 color:#07858d;
}

.sub{
 text-align:center;
 color:#777;
 margin:6px 0 22px;
}

.input{
 width:100%;
 padding:13px;
 margin:6px 0;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:16px;
}

.btn{
 width:100%;
 padding:13px;
 margin-top:8px;
 border:0;
 border-radius:10px;
 font-size:16px;
 font-weight:bold;
}

.green{background:#07858d;color:white}
.gray{background:#edf2f3;color:#123}

#app{
 display:none;
 width:100%;
 height:100vh;
 position:relative;
}

#map{
 position:absolute;
 left:0;
 right:0;
 top:58px;
 bottom:0;
 z-index:1;
}

.top{
 position:absolute;
 left:0;
 right:0;
 top:0;
 height:58px;
 background:white;
 z-index:1000;
 display:flex;
 align-items:center;
 gap:6px;
 padding:7px;
 box-shadow:0 2px 8px #0003;
}

.brand{
 font-size:17px;
 font-weight:bold;
 color:#07858d;
 white-space:nowrap;
}

.search{
 flex:1;
 min-width:0;
 border:1px solid #ddd;
 border-radius:9px;
 padding:10px;
 outline:none;
}

.topBtn{
 width:40px;
 height:40px;
 border:0;
 border-radius:9px;
 background:#edf2f3;
 font-size:19px;
}

.dashboard{
 position:absolute;
 z-index:900;
 top:68px;
 left:8px;
 right:8px;
 background:white;
 padding:9px;
 border-radius:14px;
 box-shadow:0 3px 15px #0003;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
}

.stat{
 background:#f0f6f7;
 border-radius:9px;
 text-align:center;
 padding:7px;
}

.stat b{
 display:block;
 font-size:19px;
 color:#07858d;
}

.stat span{
 font-size:10px;
 color:#555;
}

.actions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 margin-top:7px;
}

.action{
 border:0;
 border-radius:9px;
 padding:9px 3px;
 background:#07858d;
 color:white;
 font-weight:bold;
 font-size:12px;
}

.blue{background:#1769aa}
.orange{background:#e58b16}
.red{background:#c62828}

.legend{
 position:absolute;
 z-index:800;
 bottom:10px;
 left:8px;
 background:white;
 padding:8px;
 border-radius:10px;
 box-shadow:0 2px 10px #0003;
 font-size:11px;
}

.legend div{margin:3px}

.dot{
 display:inline-block;
 width:10px;
 height:10px;
 border-radius:50%;
 margin-right:4px;
}

.panel{
 position:fixed;
 z-index:3000;
 top:0;
 right:-100%;
 width:100%;
 max-width:430px;
 height:100vh;
 background:white;
 transition:.25s;
 padding:20px;
 overflow-y:auto;
 box-shadow:-5px 0 20px #0004;
}

.panel.open{right:0}

.close{
 position:absolute;
 right:12px;
 top:12px;
 width:38px;
 height:38px;
 border:0;
 border-radius:9px;
 font-size:22px;
}

.panel h2{
 margin-top:0;
 color:#06243d;
}

.location{
 background:#eef8f8;
 border-radius:10px;
 padding:12px;
 margin:8px 0;
 font-size:13px;
}

.panelBtn{
 width:100%;
 border:0;
 padding:13px;
 border-radius:10px;
 margin-top:8px;
 font-weight:bold;
 font-size:15px;
}

.pickBtn{
 background:#1769aa;
 color:white;
}

.saveBtn{
 background:#07858d;
 color:white;
}

#pickMessage{
 display:none;
 position:fixed;
 z-index:5000;
 top:70px;
 left:50%;
 transform:translateX(-50%);
 background:#06243d;
 color:white;
 padding:11px 16px;
 border-radius:20px;
 font-size:13px;
 white-space:nowrap;
}

.selectedMarker{
 z-index:4000!important;
}

#drawBar{
 display:none;
 position:fixed;
 z-index:4500;
 bottom:0;
 left:0;
 right:0;
 background:white;
 padding:10px;
 box-shadow:0 -3px 15px #0003;
}

.drawButtons{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:6px;
 margin-top:7px;
}

.drawButtons button{
 padding:10px 3px;
 border:0;
 border-radius:8px;
 background:#07858d;
 color:white;
 font-weight:bold;
}

.listItem{
 padding:11px 0;
 border-bottom:1px solid #eee;
}

.listName{
 font-weight:bold;
}

.listType{
 font-size:11px;
 color:#777;
}

.delete{
 float:right;
 border:0;
 background:#ffe8e8;
 color:#c62828;
 padding:7px;
 border-radius:7px;
}

#toast{
 display:none;
 position:fixed;
 z-index:6000;
 bottom:20px;
 left:50%;
 transform:translateX(-50%);
 background:#06243d;
 color:white;
 padding:11px 17px;
 border-radius:12px;
 text-align:center;
 max-width:90%;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
 <div class="loginBox">

  <div class="logo">SAM NETWORK</div>
  <div class="sub">Fiber Network Management</div>

  <input id="email"
   class="input"
   type="email"
   placeholder="Email">

  <input id="password"
   class="input"
   type="password"
   placeholder="Password">

  <button class="btn green" onclick="login()">
   🔐 Login
  </button>

  <button class="btn gray" onclick="signup()">
   ➕ নতুন Staff Account
  </button>

  <div id="loginStatus"
   style="text-align:center;color:#07858d;margin-top:10px;font-size:13px">
  </div>

 </div>
</div>


<!-- APP -->
<div id="app">

 <div class="top">

  <div class="brand">SAM NETWORK</div>

  <input id="search"
   class="search"
   placeholder="Search"
   oninput="searchPoint()">

  <button class="topBtn"
   onclick="locateMe()">📍</button>

  <button class="topBtn"
   onclick="openPoint()">＋</button>

 </div>


 <div id="map"></div>


 <div class="dashboard">

  <div class="stats">

   <div class="stat">
    <b id="totalPoints">0</b>
    <span>All Points</span>
   </div>

   <div class="stat">
    <b id="customerCount">0</b>
    <span>Customers</span>
   </div>

   <div class="stat">
    <b id="fiberKm">0.00</b>
    <span>Fiber KM</span>
   </div>

  </div>

  <div class="actions">

   <button class="action"
    onclick="openPoint()">＋ Point</button>

   <button class="action orange"
    onclick="startFiber()">📏 Fiber</button>

   <button class="action blue"
    onclick="locateMe()">📍 GPS</button>

   <button class="action"
    onclick="openList()">📋 Points</button>

   <button class="action red"
    onclick="logout()">🚪 Logout</button>

  </div>

 </div>


 <div class="legend">

  <div>
   <span class="dot" style="background:#00a86b"></span>
   Fiber Drop
  </div>

  <div>
   <span class="dot" style="background:#1769aa"></span>
   Box
  </div>

  <div>
   <span class="dot" style="background:#8e44ad"></span>
   OLT
  </div>

  <div>
   <span class="dot" style="background:#f39c12"></span>
   Customer
  </div>

  <div>
   <span class="dot" style="background:#c62828"></span>
   Problem
  </div>

 </div>


 <!-- POINT PANEL -->
 <div id="pointPanel" class="panel">

  <button class="close"
   onclick="closePoint()">×</button>

  <h2>➕ Add Network Point</h2>

  <select id="pointType" class="input">
   <option value="fiber_drop">Fiber Drop</option>
   <option value="box">Fiber Box</option>
   <option value="olt">OLT</option>
   <option value="customer">Customer</option>
   <option value="problem">Problem</option>
  </select>

  <input id="pointName"
   class="input"
   placeholder="Point Name">

  <input id="pointAddress"
   class="input"
   placeholder="Address">

  <input id="pointFiber"
   class="input"
   type="number"
   placeholder="Fiber Length (Meter)">

  <textarea id="pointNote"
   class="input"
   rows="3"
   placeholder="Note"></textarea>

  <div class="location">

   <b>📍 Selected Location</b>

   <div id="locationText">
    Location এখনো নেওয়া হয়নি
   </div>

  </div>

  <button class="panelBtn pickBtn"
   onclick="pickLocation()">
   🗺️ Map থেকে Location নিন
  </button>

  <button class="panelBtn saveBtn"
   onclick="savePoint()">
   💾 Save Point
  </button>

  <div id="pointStatus"
   style="text-align:center;margin-top:10px;font-size:13px">
  </div>

 </div>


 <!-- POINT LIST -->
 <div id="listPanel" class="panel">

  <button class="close"
   onclick="closeList()">×</button>

  <h2>📋 Network Points</h2>

  <div id="pointList"></div>

 </div>


 <!-- PICK MESSAGE -->
 <div id="pickMessage">
  📍 Map-এ যেখানে Point বসাতে চান সেখানে চাপুন
 </div>


 <!-- FIBER DRAW -->
 <div id="drawBar">

  <b>📏 Fiber Line</b>

  <div id="drawInfo">
   Map-এ ক্লিক করে route আঁকুন
  </div>

  <div class="drawButtons">

   <button onclick="undoFiber()">
    ↩ Undo
   </button>

   <button onclick="saveFiber()">
    💾 Save
   </button>

   <button onclick="cancelFiber()"
    style="background:#c62828">
    ✖ Cancel
   </button>

  </div>

 </div>

</div>


<div id="toast"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://cuzgpesjgjxogmbzbxhf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_tTHhdAGnSwTOuWlsnH9c4w_C1Lghz71";


let token =
localStorage.getItem("sam_access_token") || "";

let currentUser=null;


/* =========================
   MAP VARIABLES
========================= */

let map;

let points=[];

let lines=[];

let markers=[];

let lineLayers=[];

let selectedMarker=null;

let selectingLocation=false;

let selectedLocation=null;

let drawing=false;

let fiberPath=[];

let tempLine=null;


/* =========================
   START
========================= */

window.addEventListener("load",async function(){

 initMap();

 if(token){

  const ok=await getUser();

  if(ok){

   showApp();

   loadData();

  }else{

   showLogin();

  }

 }else{

  showLogin();

 }

});


/* =========================
   MAP
========================= */

function initMap(){

 map=L.map("map",{
  zoomControl:true,
  tap:true
 }).setView(
  [23.8103,90.4125],
  13
 );


 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:20,
   attribution:"© OpenStreetMap"
  }
 ).addTo(map);


 /*
   IMPORTANT:
   এখানে সরাসরি map click ধরা হচ্ছে।
   কোনো panel বা overlay থাকলেও
   Location picking mode-এ Map click কাজ করবে।
 */

 map.on("click",function(e){

  if(selectingLocation){

   selectLocation(
    e.latlng.lat,
    e.latlng.lng
   );

   return;
  }


  if(drawing){

   fiberPath.push([
    e.latlng.lat,
    e.latlng.lng
   ]);

   drawTempFiber();

  }

 });

}


/* =========================
   LOCATION SELECT
========================= */

function pickLocation(){

 /*
  প্রথমে panel পুরোপুরি সরিয়ে দিচ্ছি
 */
 document.getElementById(
  "pointPanel"
 ).classList.remove("open");


 /*
  Location selection ON
 */
 selectingLocation=true;


 /*
  Map-এর উপর message
 */
 document.getElementById(
  "pickMessage"
 ).style.display="block";


 /*
  Map resize
 */
 setTimeout(function(){

  map.invalidateSize(true);

 },300);


 showToast(
  "📍 এখন Map-এ চাপ দিন"
 );

}


/*
  Map-এ চাপ দিলে এই function চলবে
*/

function selectLocation(lat,lng){

 /*
  Selection বন্ধ
 */
 selectingLocation=false;


 /*
  Message বন্ধ
 */
 document.getElementById(
  "pickMessage"
 ).style.display="none";


 /*
  Location save
 */
 selectedLocation={
  lat:lat,
  lng:lng
 };


 /*
  আগের marker থাকলে remove
 */
 if(selectedMarker){

  map.removeLayer(
   selectedMarker
  );

 }


 /*
  নতুন marker
 */
 selectedMarker=L.marker(
  [lat,lng],
  {
   zIndexOffset:1000
  }
 ).addTo(map);


 selectedMarker.bindPopup(
  "📍 Selected Location"
 ).openPopup();


 /*
  Form-এ location দেখানো
 */
 document.getElementById(
  "locationText"
 ).innerHTML=
 "✅ Location Selected<br>"+
 "Latitude: "+lat.toFixed(6)+
 "<br>"+
 "Longitude: "+lng.toFixed(6);


 /*
  Panel আবার খুলবে
 */
 document.getElementById(
  "pointPanel"
 ).classList.add("open");


 showToast(
  "✅ Location সফলভাবে নেওয়া হয়েছে"
 );

}


/* =========================
   POINT PANEL
========================= */

function openPoint(){

 document.getElementById(
  "listPanel"
 ).classList.remove("open");

 document.getElementById(
  "pointPanel"
 ).classList.add("open");

}


function closePoint(){

 document.getElementById(
  "pointPanel"
 ).classList.remove("open");

}


/* =========================
   AUTH
========================= */

async function login(){

 const email=
 document.getElementById(
  "email"
 ).value.trim();

 const password=
 document.getElementById(
  "password"
 ).value;


 if(!email||!password){

  setLoginStatus(
   "Email ও Password দিন"
  );

  return;
 }


 setLoginStatus(
  "Login হচ্ছে..."
 );


 try{

  const res=await fetch(
   SUPABASE_URL+
   "/auth/v1/token?grant_type=password",
   {
    method:"POST",

    headers:{
     "apikey":SUPABASE_KEY,
     "Content-Type":"application/json"
    },

    body:JSON.stringify({
     email:email,
     password:password
    })
   }
  );


  const data=await res.json();


  if(!res.ok){

   throw new Error(
    data.error_description||
    data.msg||
    "Login failed"
   );

  }


  token=data.access_token;

  currentUser=data.user;

  localStorage.setItem(
   "sam_access_token",
   token
  );


  showApp();

  loadData();

 }catch(e){

  setLoginStatus(
   "❌ "+e.message
  );

 }

}


async function signup(){

 const email=
 document.getElementById(
  "email"
 ).value.trim();

 const password=
 document.getElementById(
  "password"
 ).value;


 if(!email||!password){

  setLoginStatus(
   "Email ও Password দিন"
  );

  return;
 }


 if(password.length<6){

  setLoginStatus(
   "Password কমপক্ষে ৬ অক্ষর দিন"
  );

  return;
 }


 setLoginStatus(
  "Account তৈরি হচ্ছে..."
 );


 try{

  const res=await fetch(
   SUPABASE_URL+"/auth/v1/signup",
   {
    method:"POST",

    headers:{
     "apikey":SUPABASE_KEY,
     "Content-Type":"application/json"
    },

    body:JSON.stringify({
     email:email,
     password:password
    })
   }
  );


  const data=await res.json();


  if(!res.ok){

   throw new Error(
    data.msg||
    data.error_description||
    "Signup failed"
   );

  }


  if(data.access_token){

   token=data.access_token;

   currentUser=data.user;

   localStorage.setItem(
    "sam_access_token",
    token
   );

   showApp();

   loadData();

  }else{

   setLoginStatus(
    "✅ Account তৈরি হয়েছে। Email verify করে Login করুন।"
   );

  }

 }catch(e){

  setLoginStatus(
   "❌ "+e.message
  );

 }

}


async function getUser(){

 try{

  const res=await fetch(
   SUPABASE_URL+"/auth/v1/user",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+token
    }
   }
  );


  if(!res.ok){

   localStorage.removeItem(
    "sam_access_token"
   );

   token="";

   return false;

  }


  currentUser=await res.json();

  return true;

 }catch(e){

  return false;

 }

}


function logout(){

 localStorage.removeItem(
  "sam_access_token"
 );

 token="";

 currentUser=null;

 document.getElementById(
  "app"
 ).style.display="none";

 document.getElementById(
  "loginPage"
 ).style.display="flex";

}


/* =========================
   UI
========================= */

function showApp(){

 document.getElementById(
  "loginPage"
 ).style.display="none";

 document.getElementById(
  "app"
 ).style.display="block";

 setTimeout(function(){

  map.invalidateSize(true);

 },300);

}


function showLogin(){

 document.getElementById(
  "loginPage"
 ).style.display="flex";

 document.getElementById(
  "app"
 ).style.display="none";

}


function setLoginStatus(text){

 document.getElementById(
  "loginStatus"
 ).innerText=text;

}


function showToast(text){

 const t=
 document.getElementById("toast");

 t.innerText=text;

 t.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(
  function(){
   t.style.display="none";
  },
  2500
 );

}


/* =========================
   SAVE POINT
========================= */

async function savePoint(){

 if(!currentUser){

  showToast("আগে Login করুন");

  return;

 }


 if(!selectedLocation){

  showToast(
   "আগে Map থেকে Location নিন"
  );

  return;

 }


 const name=
 document.getElementById(
  "pointName"
 ).value.trim();


 if(!name){

  showToast(
   "Point Name দিন"
  );

  return;

 }


 const type=
 document.getElementById(
  "pointType"
 ).value;


 const address=
 document.getElementById(
  "pointAddress"
 ).value.trim();


 const fiber=
 Number(
  document.getElementById(
   "pointFiber"
  ).value
 )||0;


 const note=
 document.getElementById(
  "pointNote"
 ).value.trim();


 document.getElementById(
  "pointStatus"
 ).innerText=
 "Saving...";


 try{

  const res=await fetch(
   SUPABASE_URL+
   "/rest/v1/network_points",
   {
    method:"POST",

    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+token,
     "Content-Type":"application/json",
     "Prefer":"return=representation"
    },

    body:JSON.stringify({

     name:name,

     point_type:type,

     latitude:selectedLocation.lat,

     longitude:selectedLocation.lng,

     fiber_length:fiber,

     address:address,

     note:note,

     created_by:currentUser.id

    })
   }
  );


  const data=await res.json();


  if(!res.ok){

   throw new Error(
    data.message||
    JSON.stringify(data)
   );

  }


  document.getElementById(
   "pointStatus"
  ).innerText="";


  document.getElementById(
   "pointName"
  ).value="";

  document.getElementById(
   "pointAddress"
  ).value="";

  document.getElementById(
   "pointFiber"
  ).value="";

  document.getElementById(
   "pointNote"
  ).value="";


  selectedLocation=null;


  document.getElementById(
   "locationText"
  ).innerHTML=
   "Location এখনো নেওয়া হয়নি";


  if(selectedMarker){

   map.removeLayer(
    selectedMarker
   );

   selectedMarker=null;

  }


  closePoint();


  showToast(
   "✅ Point Save হয়েছে"
  );


  loadData();

 }catch(e){

  document.getElementById(
   "pointStatus"
  ).innerText=
   "❌ "+e.message;

 }

}


/* =========================
   LOAD DATA
========================= */

async function loadData(){

 try{

  const p=await fetch(
   SUPABASE_URL+
   "/rest/v1/network_points?select=*&order=created_at.desc",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+token
    }
   }
  );


  if(!p.ok){

   throw new Error(
    await p.text()
   );

  }


  points=await p.json();


  const f=await fetch(
   SUPABASE_URL+
   "/rest/v1/fiber_lines?select=*&order=created_at.desc",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+token
    }
   }
  );


  if(f.ok){

   lines=await f.json();

  }else{

   lines=[];

  }


  drawMap();

 }catch(e){

  console.log(e);

  showToast(
   "Cloud data load হয়নি"
  );

 }

}


/* =========================
   DRAW MAP
========================= */

function drawMap(){

 markers.forEach(function(m){

  map.removeLayer(m);

 });

 markers=[];


 lineLayers.forEach(function(l){

  map.removeLayer(l);

 });

 lineLayers=[];


 points.forEach(function(p){

  if(p.latitude==null||p.longitude==null)
   return;


  const color=getColor(
   p.point_type
  );


  const m=L.circleMarker(
   [p.latitude,p.longitude],
   {
    radius:8,
    color:"#fff",
    weight:2,
    fillColor:color,
    fillOpacity:1
   }
  ).addTo(map);


  m.bindPopup(
   "<b>"+
   safe(p.name) +
   "</b><br>"+
   "Type: "+
   safe(p.point_type)+
   "<br>"+
   "Fiber: "+
   Number(p.fiber_length||0)+
   " m"
  );


  markers.push(m);

 });


 lines.forEach(function(line){

  let path=line.path;


  if(typeof path==="string"){

   try{
    path=JSON.parse(path);
   }catch(e){
    return;
   }

  }


  if(!Array.isArray(path))
   return;


  const poly=L.polyline(
   path,
   {
    color:"#07858d",
    weight:5
   }
  ).addTo(map);


  poly.bindPopup(
   "<b>Fiber Line</b><br>"+
   "Length: "+
   (
    Number(line.length_m||0)/1000
   ).toFixed(3)+
   " KM"
  );


  lineLayers.push(poly);

 });


 updateDashboard();

 renderList();

}


function getColor(type){

 if(type==="fiber_drop")
  return "#00a86b";

 if(type==="box")
  return "#1769aa";

 if(type==="olt")
  return "#8e44ad";

 if(type==="customer")
  return "#f39c12";

 if(type==="problem")
  return "#c62828";

 return "#555";

}


function safe(x){

 return String(x||"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================
   DASHBOARD
========================= */

function updateDashboard(){

 document.getElementById(
  "totalPoints"
 ).innerText=points.length;


 document.getElementById(
  "customerCount"
 ).innerText=
  points.filter(function(p){
   return p.point_type==="customer";
  }).length;


 let meters=0;


 points.forEach(function(p){

  meters+=Number(
   p.fiber_length||0
  );

 });


 lines.forEach(function(l){

  meters+=Number(
   l.length_m||0
  );

 });


 document.getElementById(
  "fiberKm"
 ).innerText=
  (meters/1000).toFixed(2);

}


/* =========================
   LIST
========================= */

function openList(){

 document.getElementById(
  "listPanel"
 ).classList.add("open");

 renderList();

}


function closeList(){

 document.getElementById(
  "listPanel"
 ).classList.remove("open");

}


function renderList(){

 const box=
 document.getElementById(
  "pointList"
 );


 if(!points.length){

  box.innerHTML=
   "<p>কোনো Point নেই।</p>";

  return;

 }


 box.innerHTML="";


 points.forEach(function(p){

  const div=
  document.createElement("div");

  div.className="listItem";


  div.innerHTML=
   "<button class='delete' "+
   "onclick=\"deletePoint('"+
   p.id+
   "')\">Delete</button>"+
   "<div class='listName'>"+
   safe(p.name)+
   "</div>"+
   "<div class='listType'>"+
   safe(p.point_type)+
   "</div>";


  div.onclick=function(e){

   if(
    e.target.classList.contains(
     "delete"
    )
   )
    return;


   map.setView(
    [p.latitude,p.longitude],
    18
   );

   closeList();

  };


  box.appendChild(div);

 });

}


async function deletePoint(id){

 if(!confirm(
  "এই Point Delete করবেন?"
 ))
 return;


 try{

  const res=await fetch(
   SUPABASE_URL+
   "/rest/v1/network_points?id=eq."+
   encodeURIComponent(id),
   {
    method:"DELETE",

    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+token
    }
   }
  );


  if(!res.ok){

   throw new Error(
    await res.text()
   );

  }


  showToast(
   "Point Delete হয়েছে"
  );

  loadData();

 }catch(e){

  showToast(
   "Delete হয়নি"
  );

 }

}


/* =========================
   SEARCH
========================= */

function searchPoint(){

 const q=
 document.getElementById(
  "search"
 ).value.trim().toLowerCase();


 if(!q)
  return;


 const found=points.find(
  function(p){

   return String(
    p.name||""
   ).toLowerCase().includes(q)

   ||

   String(
    p.address||""
   ).toLowerCase().includes(q);

  }
 );


 if(found){

  map.setView(
   [found.latitude,found.longitude],
   18
  );

 }

}


/* =========================
   GPS
========================= */

function locateMe(){

 if(!navigator.geolocation){

  showToast(
   "GPS support নেই"
  );

  return;

 }


 showToast(
  "📍 GPS নেওয়া হচ্ছে..."
 );


 navigator.geolocation.getCurrentPosition(

  function(pos){

   const lat=
    pos.coords.latitude;

   const lng=
    pos.coords.longitude;


   map.setView(
    [lat,lng],
    18
   );


   L.marker(
    [lat,lng]
   )
   .addTo(map)
   .bindPopup(
    "📍 আপনার GPS Location"
   )
   .openPopup();


   showToast(
    "✅ GPS Location পাওয়া গেছে"
   );

  },

  function(){

   showToast(
    "GPS Permission দিন"
   );

  },

  {
   enableHighAccuracy:true,
   timeout:15000
  }

 );

}


/* =========================
   FIBER
========================= */

function startFiber(){

 drawing=true;

 fiberPath=[];


 document.getElementById(
  "drawBar"
 ).style.display="block";


 document.getElementById(
  "drawInfo"
 ).innerText=
  "Map-এ ক্লিক করে Fiber route আঁকুন";


 showToast(
  "📏 Fiber route শুরু করুন"
 );

}


function drawTempFiber(){

 if(tempLine){

  map.removeLayer(
   tempLine
  );

 }


 if(fiberPath.length<2){

  document.getElementById(
   "drawInfo"
  ).innerText=
   "কমপক্ষে ২টি Point দিন";

  return;

 }


 tempLine=L.polyline(
  fiberPath,
  {
   color:"#e58b16",
   weight:5,
   dashArray:"8,8"
  }
 ).addTo(map);


 let meters=0;


 for(
  let i=1;
  i<fiberPath.length;
  i++
 ){

  meters+=map.distance(
   L.latLng(
    fiberPath[i-1][0],
    fiberPath[i-1][1]
   ),
   L.latLng(
    fiberPath[i][0],
    fiberPath[i][1]
   )
  );

 }


 document.getElementById(
  "drawInfo"
 ).innerText=
 "Points: "+
 fiberPath.length+
 " | "+
 meters.toFixed(1)+
 " meter";

}


function undoFiber(){

 if(fiberPath.length){

  fiberPath.pop();

  drawTempFiber();

 }

}


function cancelFiber(){

 drawing=false;

 fiberPath=[];


 if(tempLine){

  map.removeLayer(
   tempLine
  );

  tempLine=null;

 }


 document.getElementById(
  "drawBar"
 ).style.display="none";

}


async function saveFiber(){

 if(fiberPath.length<2){

  showToast(
   "কমপক্ষে ২টি Point দিন"
  );

  return;

 }


 let meters=0;


 for(
  let i=1;
  i<fiberPath.length;
  i++
 ){

  meters+=map.distance(
   L.latLng(
    fiberPath[i-1][0],
    fiberPath[i-1][1]
   ),
   L.latLng(
    fiberPath[i][0],
    fiberPath[i][1]
   )
  );

 }


 const name=
 prompt(
  "Fiber Line-এর নাম দিন",
  "Fiber Line"
 );


 if(!name)
  return;


 try{

  const res=await fetch(
   SUPABASE_URL+
   "/rest/v1/fiber_lines",
   {
    method:"POST",

    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer "+token,
     "Content-Type":"application/json",
     "Prefer":"return=representation"
    },

    body:JSON.stringify({

     name:name,

     path:fiberPath,

     length_m:meters,

     created_by:currentUser.id

    })
   }
  );


  if(!res.ok){

   throw new Error(
    await res.text()
   );

  }


  showToast(
   "✅ Fiber Line Save হয়েছে"
  );


  cancelFiber();

  loadData();

 }catch(e){

  console.log(e);

  showToast(
   "❌ Fiber Line Save হয়নি"
  );

 }

}

</script>
